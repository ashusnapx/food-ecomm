<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Ashutosh Kumar">
  <!-- Notebook page: cream stock, blue rule, red margin, one ink letter.
       Drawn as paths rather than text so it never depends on a font being
       available, and sized on a 48 unit grid because Google wants favicons
       square and a multiple of 48. -->
  <rect width="48" height="48" fill="#F3F1E9"/>
  <g stroke="#C3D4E8" stroke-width="1.4" opacity="0.9">
    <path d="M0 15h48M0 33h48"/>
  </g>
  <path d="M11 0v48" stroke="#E08C8C" stroke-width="1.8"/>
  <g fill="none" stroke="#1B1A16" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 39 27.5 11 37 39"/>
    <path d="M21.5 31h12"/>
  </g>
</svg>
